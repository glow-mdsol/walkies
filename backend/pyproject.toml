[project]
name = "walkies"
version = "0.1.0"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
dependencies = [
    "fastapi>=0.115.0",
    "google-auth[requests]>=2.38.0",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
# Tooling for extracting, summarising and compacting the reference PDFs in
# ../sources into a reviewable digest (see `sources_review` / `task sources:digest`).
# Not needed to run the web app. The `anthropic` SDK is only used by the optional
# `--llm` enrichment path and is imported lazily, so the heuristic digest still
# works if it is absent.
sources = [
    "pypdf>=5.0.0",
    "anthropic>=0.40.0",
]
