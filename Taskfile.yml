version: '3'

dotenv: ['.env']

tasks:
  default:
    cmds:
      - task: dev

  dev:
    desc: Start both servers with auto-reload (backend :8000, frontend :5173)
    deps: [backend, frontend]

  backend:
    desc: Start FastAPI dev server on :8000 (auto-reload on file changes)
    dir: backend
    cmds:
      - uv run uvicorn main:app --reload

  frontend:
    desc: Start Vite dev server on :5173 (HMR)
    dir: frontend
    cmds:
      - npm run dev

  install:
    desc: Install all dependencies
    deps: [install:backend, install:frontend]

  install:backend:
    desc: Install Python dependencies (uv sync)
    dir: backend
    cmds:
      - uv sync

  install:frontend:
    desc: Install Node dependencies (npm install)
    dir: frontend
    cmds:
      - npm install

  build:
    desc: Build frontend for production
    dir: frontend
    cmds:
      - npm run build

  docker:build:
    desc: Build the backend and frontend Docker images
    cmds:
      - docker compose build

  docker:up:
    desc: Build and start the Docker Compose stack
    cmds:
      - docker compose up --build

  docker:down:
    desc: Stop the Docker Compose stack
    cmds:
      - docker compose down

  analytics:migrate:
    desc: Migrate analytics/share-link data from legacy sqlite into configured analytics backend
    dir: backend
    cmds:
      - uv run python -m analytics.migrate

  sources:install:
    desc: Install the source-review tooling dependency group (pypdf, anthropic)
    dir: backend
    cmds:
      - uv sync --group sources

  sources:list:
    desc: List the source PDFs that would be digested
    dir: backend
    cmds:
      - uv run --group sources python -m sources_review --list

  sources:digest:
    desc: Extract + compact the PDFs in sources/ into sources/DIGEST.md (heuristic)
    dir: backend
    cmds:
      - uv run --group sources python -m sources_review {{.CLI_ARGS}}

  sources:digest:llm:
    desc: As sources:digest but enrich summaries with Claude (needs ANTHROPIC_API_KEY)
    dir: backend
    cmds:
      - uv run --group sources python -m sources_review --llm {{.CLI_ARGS}}

  test:
    desc: Run backend unit tests with pytest
    dir: backend
    cmds:
      - uv run pytest tests/

