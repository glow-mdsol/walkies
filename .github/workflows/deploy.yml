name: Deploy Walkies to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@4111bea63989c47c7c34b8d78018e69d95f87b32 # v2.1.3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP SDK
        uses: google-github-actions/setup-gcloud@fc0543792ea1ba666c86fea9792d1d72e253ca97 # v2.1.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3d2432a588b39869269411986422d # v3.3.0

      - name: Build and Push Backend Image
        uses: docker/build-push-action@0a97817b6ade01f4081c518844883f80c6566838 # v5.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/walkies-repo/backend:latest
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/walkies-repo/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy walkies-backend \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/walkies-repo/backend:${{ github.sha }} \
            --region=${{ secrets.GCP_REGION }} \
            --execution-environment=gen2 \
            --service-account=walkies-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --add-volume=name=walkies-data,type=cloud-storage,bucket=walkies-data-${{ secrets.GCP_PROJECT_ID }} \
            --add-volume-mount=volume=walkies-data,mount-path=/app/backend/data \
            --set-env-vars="ANALYTICS_DB_URL=${{ secrets.ANALYTICS_DB_URL }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --allow-unauthenticated

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@4111bea63989c47c7c34b8d78018e69d95f87b32 # v2.1.3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP SDK
        uses: google-github-actions/setup-gcloud@fc0543792ea1ba666c86fea9792d1d72e253ca97 # v2.1.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Frontend to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
            if (config.hosting && config.hosting.rewrites) {
              config.hosting.rewrites.forEach(r => {
                if (r.run) {
                  r.run.region = process.env.GCP_REGION || 'us-central1';
                }
              });
            }
            fs.writeFileSync('firebase.json', JSON.stringify(config, null, 2));
          "
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }}
